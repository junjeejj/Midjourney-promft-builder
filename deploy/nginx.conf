server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 정적 에셋은 그대로 서빙
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|txt|webp)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
  }

  # Vite/React SPA fallback: 파일이 없으면 index.html 반환
  location / {
    try_files $uri /index.html;
  }

  # 필요 시 API 프록시 예시 (주석)
  # location /api/ {
  #   proxy_pass http://localhost:3000;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
}

